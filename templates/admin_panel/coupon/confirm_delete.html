{% extends "admin_panel/base_admin.html" %}

{% block title %}Supprimer coupon{% endblock %}

{% block admin_content %}
<h1>Supprimer coupon</h1>

<p>Tu veux supprimer ce coupon ?</p>
<p><strong>{{ coupon.code }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer suppression</button>
</form>

<a href="{% url 'admin_panel:coupon_list' %}">Annuler</a>
{% endblock %}
