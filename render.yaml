databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: ecommerce
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_SUPPORT_MODEL
        value: "gpt-4o-mini"
      - key: PYTHON_VERSION
        value: "3.13.0"
